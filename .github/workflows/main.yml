name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the signed APK to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Android Firebase configuration
        env:
          FINBOSS_ANDROID_FIREBASE_API_KEY: ${{ secrets.FINBOSS_ANDROID_FIREBASE_API_KEY }}
        run: python3 scripts/configure_firebase.py android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Project Keystore & Firebase Config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Restoring app/google-services.json from GitHub Secret..."
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi
          if [ -f "app/debug.keystore.base64" ]; then
            echo "Decoding app/debug.keystore.base64..."
            base64 -d app/debug.keystore.base64 > app/debug.keystore
            cp app/debug.keystore debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding root debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
            cp debug.keystore app/debug.keystore
          else
            echo "debug.keystore.base64 not found; generating fresh debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp debug.keystore app/debug.keystore
          fi
          rm -f my-upload-key.jks
          keytool -importkeystore \
            -srckeystore debug.keystore \
            -srcstorepass android \
            -srckeypass android \
            -srcalias androiddebugkey \
            -destkeystore my-upload-key.jks \
            -deststorepass android \
            -destkeypass android \
            -destalias upload \
            -noprompt
          keytool -list -v -keystore my-upload-key.jks -storepass android -alias upload

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          gradle assembleRelease

      - name: Align & Sign with v1, v2, v3 for All USB/Android Devices
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort -V | tail -n 1)
          BUILT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS/zipalign -f -v -p 4 "$BUILT_APK" app-aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks my-upload-key.jks \
            --ks-key-alias upload \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Finboss-Billing-Signed.apk \
            app-aligned.apk
          $BUILD_TOOLS/apksigner verify --verbose Finboss-Billing-Signed.apk

      - name: Upload Signed APK Artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Finboss-Billing-Signed-APK
          path: Finboss-Billing-Signed.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2-latest
          name: Finboss Billing No.1 ERP (Signed Universal APK)
          files: Finboss-Billing-Signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
