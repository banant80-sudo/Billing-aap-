name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Project Keystore & Print SHA-1
        run: |
          base64 -d debug.keystore.base64 > debug.keystore
          rm -f my-upload-key.jks
          keytool -importkeystore \
            -srckeystore debug.keystore \
            -srcstorepass android \
            -srckeypass android \
            -srcalias androiddebugkey \
            -destkeystore my-upload-key.jks \
            -deststorepass android \
            -destkeypass android \
            -destalias upload \
            -noprompt
          keytool -list -v -keystore my-upload-key.jks -storepass android -alias upload
          if ! grep -q "client_type\": 3" app/google-services.json 2>/dev/null; then
            mkdir -p app/src/main/res/values
            cat <<EOF > app/src/main/res/values/google_services_fix.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false">000000000000-placeholder.apps.googleusercontent.com</string>
          </resources>
          EOF
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          gradle assembleRelease

      - name: Align & Sign with v1, v2, v3 for All USB/Android Devices
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort -V | tail -n 1)
          BUILT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS/zipalign -f -v -p 4 "$BUILT_APK" app-aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks my-upload-key.jks \
            --ks-key-alias upload \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Finboss-Billing-Signed.apk \
            app-aligned.apk
          $BUILD_TOOLS/apksigner verify --verbose Finboss-Billing-Signed.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finboss-Billing-Signed-APK
          path: Finboss-Billing-Signed.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-latest
          name: Finboss Billing No.1 ERP (Signed Universal APK)
          files: Finboss-Billing-Signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
