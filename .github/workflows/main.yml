name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Release Keystore & Print SHA-1
        run: |
          keytool -genkey -v -keystore release.keystore -storepass android123 -alias finbosskey -keypass android123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Finboss,O=RaghavEnterprises,C=IN"
          keytool -list -v -keystore release.keystore -storepass android123 -alias finbosskey
          cp release.keystore my-upload-key.jks
          if ! grep -q "client_type\": 3" app/google-services.json 2>/dev/null; then
            mkdir -p app/src/main/res/values
            cat <<EOF > app/src/main/res/values/google_services_fix.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false">000000000000-placeholder.apps.googleusercontent.com</string>
          </resources>
          EOF
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=finbosskey \
            -Pandroid.injected.signing.key.password=android123

      - name: Re-sign with v1, v2, v3 for ColorOS 13
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort -V | tail -n 1)
          BUILT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 "$BUILT_APK" app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:android123 --key-pass pass:android123 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out Finboss-Billing-Signed.apk app-aligned.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finboss-Billing-Signed-APK
          path: Finboss-Billing-Signed.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: Finboss Billing App (Signed Release)
          files: Finboss-Billing-Signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
