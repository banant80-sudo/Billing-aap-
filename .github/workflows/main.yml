name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the signed APK to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Android Firebase configuration
        env:
          FINBOSS_ANDROID_FIREBASE_API_KEY: ${{ secrets.FINBOSS_ANDROID_FIREBASE_API_KEY }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 scripts/configure_firebase.py android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare APK signing key
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/finboss-upload.jks
          RELEASE_KEYSTORE_BASE64: ${{ env.PUBLISH_RELEASE == 'true' && secrets.FINBOSS_RELEASE_KEYSTORE_BASE64 || '' }}
          RELEASE_STORE_PASSWORD: ${{ env.PUBLISH_RELEASE == 'true' && secrets.FINBOSS_RELEASE_KEYSTORE_PASSWORD || '' }}
          RELEASE_KEY_PASSWORD: ${{ env.PUBLISH_RELEASE == 'true' && secrets.FINBOSS_RELEASE_KEY_PASSWORD || '' }}
        run: |
          umask 077
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_STORE_PASSWORD" || -z "$RELEASE_KEY_PASSWORD" ]]; then
              echo "::error::Set the Finboss release keystore and both signing password secrets before publishing."
              exit 1
            fi
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            keytool -list -v -keystore "$KEYSTORE_PATH" -storepass:env RELEASE_STORE_PASSWORD -alias upload
          else
            keytool -genkeypair -keystore "$KEYSTORE_PATH" -alias upload -storepass android \
              -keypass android -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=Finboss CI Test,O=Finboss,C=IN"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/finboss-upload.jks
          STORE_PASSWORD: ${{ env.PUBLISH_RELEASE == 'true' && secrets.FINBOSS_RELEASE_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ env.PUBLISH_RELEASE == 'true' && secrets.FINBOSS_RELEASE_KEY_PASSWORD || 'android' }}
        run: |
          gradle assembleRelease

      - name: Align and verify APK signatures
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/finboss-upload.jks
          STORE_PASSWORD: ${{ env.PUBLISH_RELEASE == 'true' && secrets.FINBOSS_RELEASE_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ env.PUBLISH_RELEASE == 'true' && secrets.FINBOSS_RELEASE_KEY_PASSWORD || 'android' }}
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort -V | tail -n 1)
          BUILT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS/zipalign -f -v -p 4 "$BUILT_APK" app-aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias upload \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Finboss-Billing-Signed.apk \
            app-aligned.apk
          $BUILD_TOOLS/apksigner verify --verbose Finboss-Billing-Signed.apk

      - name: Upload Signed APK Artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Finboss-Billing-Signed-APK
          path: Finboss-Billing-Signed.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2-latest
          name: Finboss Billing No.1 ERP (Signed Universal APK)
          files: Finboss-Billing-Signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
