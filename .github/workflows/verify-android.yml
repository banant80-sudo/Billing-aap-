name: Verify Android Firebase startup configuration

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/verify-android.yml'

permissions:
  contents: read

jobs:
  verify-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK with a temporary signing key
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=Android Debug,O=Android,C=US"
          gradle :app:assembleDebug

      - name: Check the packaged Firebase and Google Sign-In resources
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt2" dump resources app/build/outputs/apk/debug/app-debug.apk > resources.txt
          for resource in google_app_id google_api_key project_id default_web_client_id; do
            grep -Eq "string/${resource}([[:space:]]|$)" resources.txt || {
              echo "::error::Missing Firebase APK resource: $resource"
              exit 1
            }
          done
          if grep -q '000000000000-placeholder.apps.googleusercontent.com' resources.txt; then
            echo "::error::Found a placeholder Google OAuth client ID in the APK"
            exit 1
          fi

      - name: Launch the APK on an Android emulator
        run: |
          set -euo pipefail
          if [[ ! -w /dev/kvm ]]; then
            sudo chgrp "$(id -gn)" /dev/kvm
            sudo chmod g+rw /dev/kvm
          fi

          image='system-images;android-35;google_apis;x86_64'
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          test -x "$sdkmanager"
          "$sdkmanager" --install emulator platform-tools "$image"
          "${sdkmanager%/*}/avdmanager" create avd --name finboss-smoke --package "$image" <<< no
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          emulator -avd finboss-smoke -no-window -no-audio -no-snapshot \
            -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          if ! timeout 180 bash -c 'adb wait-for-device && until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'; then
            tail -n 50 emulator.log
            exit 1
          fi

          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          apk=app/build/outputs/apk/debug/app-debug.apk
          package=com.aistudio.finbosserp.vqmtxr
          adb install "$apk"
          adb logcat -c
          adb shell am start -W -n "$package/com.example.MainActivity"

          for attempt in {1..8}; do
            if timeout 12 adb shell uiautomator dump /sdcard/finboss-window.xml >/dev/null 2>&1 &&
              adb exec-out cat /sdcard/finboss-window.xml > finboss-window.xml &&
              grep -q 'text="Owner (Google)"' finboss-window.xml &&
              grep -q 'text="Salesman (OTP)"' finboss-window.xml &&
              adb shell pidof "$package" >/dev/null; then
              echo "Finboss reached the sign-in screen and stayed open."
              exit 0
            fi
            sleep 2
          done

          echo "::error::Finboss did not reach the sign-in screen"
          adb logcat -d -s AndroidRuntime:E FinbossStartup:E
          exit 1
